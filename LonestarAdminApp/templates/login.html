<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lonestar Buckeye Woodworks - Admin</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: #f4f1ec;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0;
  }
  .card {
    background: #fff; border: 1px solid #d9cfc0; border-radius: 10px;
    padding: 32px; width: 320px; max-width: 90vw;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 18px; text-align: center; margin: 0 0 4px;
    color: #5b3a29;
  }
  p.tagline { text-align: center; color: #8a7c6c; font-size: 13px; margin: 0 0 24px; }
  label { font-size: 13px; color: #444; display: block; margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 15px; margin-bottom: 14px;
  }
  button {
    width: 100%; padding: 10px; border: none; border-radius: 6px;
    background: #5b3a29; color: #fff; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #4a2f21; }
  .error { color: #b3261e; font-size: 13px; margin-bottom: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Lonestar Buckeye Woodworks</h1>
    <p class="tagline">Invoice Admin</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
